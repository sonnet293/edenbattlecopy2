<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utopia Battle · 배틀룸</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body>

    <header class="topbar">
        <a class="brand" href="main.html"><img src="img/몬스터볼.png" alt=""><span>UTOPIA BATTLE</span></a>
        <div class="topbar-actions">
            <a class="trainer-chip" href="profile.html" title="트레이너 카드">
                <span class="initial" id="trainer-initial">?</span>
                <span class="label" id="trainer-name">트레이너</span>
            </a>
            <button type="button" class="text-btn" id="logoutBtn">로그아웃</button>
        </div>
    </header>

    <main class="main-wrap">
        <div class="main-head">
            <div>
                <span class="eyebrow">BATTLE ROOMS</span>
                <h1>배틀룸 선택</h1>
                <p>입장할 배틀필드를 골라주세요. 자리가 차 있으면 관전자로 입장합니다.</p>
            </div>
            <div class="room-summary" id="room-summary"></div>
        </div>

        <div class="room-grid" id="room-grid"></div>
    </main>

    <script type="module" src="js/main.js"></script>

</body>
</html>
