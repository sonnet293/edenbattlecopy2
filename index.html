<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utopia Battle · 로그인</title>
    <link rel="stylesheet" href="css/site.css">
</head>
<body class="login-page">

    <main class="login-card">
        <img class="login-logo" src="img/몬스터볼.png" alt="">
        <h1 class="login-title">UTOPIA BATTLE</h1>
        <p class="login-sub">트레이너 계정으로 로그인하세요</p>

        <form class="login-form" id="loginForm" novalidate>
            <label class="field">
                <span>이메일</span>
                <input type="email" id="email" placeholder="trainer@example.com" autocomplete="email" required />
            </label>
            <label class="field">
                <span>비밀번호</span>
                <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password" required />
            </label>
            <button type="submit" id="loginBtn" class="btn btn-primary">로그인</button>
            <p id="message" class="form-message" role="alert"></p>
        </form>
    </main>

    <script type="module" src="js/login.js"></script>

</body>
</html>
